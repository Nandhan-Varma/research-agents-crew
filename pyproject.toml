[project]
name = "ai_research_crew"
version = "0.1.0"
description = "ai-research-crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.22,<2.0.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
ai_research_crew = "ai_research_crew.main:run"
run_crew = "ai_research_crew.main:run"
train = "ai_research_crew.main:train"
replay = "ai_research_crew.main:replay"
test = "ai_research_crew.main:test"
run_with_trigger = "ai_research_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "5c937087-ae0b-4050-90ab-e08e35cde2ce"
